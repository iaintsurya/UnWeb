name: UnWeb CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend tests
        working-directory: frontend
        run: npm test

  browser-worker-image:
    name: Browser worker container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build optional browser worker image
        run: docker build --file Dockerfile.browser-worker --tag unweb-browser-worker:${{ github.sha }} .
      - name: Verify non-root runtime and installed Chromium
        run: |
          docker run --rm --entrypoint python unweb-browser-worker:${{ github.sha }} -c "import os; from playwright.sync_api import sync_playwright; assert os.getuid() != 0; p = sync_playwright().start(); assert os.path.isfile(p.chromium.executable_path); p.stop()"

  production-deployment:
    name: Production images and compose smoke test
    runs-on: ubuntu-latest
    env:
      UNWEB_AUTH_PROXY_SECRET: ci-only-not-a-production-secret
      UNWEB_INGRESS_NETWORK: unweb-ci-ingress
      UNWEB_EGRESS_NETWORK: unweb-ci-egress
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Create isolated compose networks
        run: |
          docker network create unweb-ci-ingress
          docker network create unweb-ci-egress
      - name: Validate production compose configuration
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml config --quiet
      - name: Build and start production stack
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml up -d --build
      - name: Verify frontend, API health, and authentication boundary
        run: |
          docker compose --env-file .env.production.example -f docker-compose.production.yml exec -T frontend wget -q -O /dev/null http://127.0.0.1:8080/
          docker compose --env-file .env.production.example -f docker-compose.production.yml exec -T api python - <<'PY'
          import urllib.request
          import urllib.error
          urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=5).read()
          request = urllib.request.Request("http://127.0.0.1:8000/api/scans")
          try:
              urllib.request.urlopen(request, timeout=5)
          except urllib.error.HTTPError as error:
              assert error.code == 401, error.code
          else:
              raise AssertionError("Unauthenticated API request unexpectedly succeeded")
          PY
      - name: Show service health
        if: always()
        run: docker compose --env-file .env.production.example -f docker-compose.production.yml ps
      - name: Stop production stack
        if: always()
        run: |
          docker compose --env-file .env.production.example -f docker-compose.production.yml down -v
          docker network rm unweb-ci-ingress unweb-ci-egress || true
