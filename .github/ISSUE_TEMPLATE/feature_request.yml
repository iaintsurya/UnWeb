name: Feature request
description: Propose a focused feature.
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem to solve}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed behaviour}
    validations: {required: true}
  - type: textarea
    id: safety
    attributes: {label: Security and privacy considerations}
    validations: {required: true}
